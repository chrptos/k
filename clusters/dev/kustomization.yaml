resources:
  - apps.yaml
  - git-repo.yaml

replacements:
  - source:
      kind: ConfigMap
      name: git-repo-config
      fieldPath: data.repoURL
    targets:
      - select:
          kind: Application
          name: external-secrets-config-dev
        fieldPaths:
          - spec.source.repoURL
      - select:
          kind: Application
          name: hello-world-dev
        fieldPaths:
          - spec.source.repoURL
